name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://movasseghi:movasseghi@localhost:5432/movasseghi
          PAYLOAD_SECRET: ci-build-secret-min-32-chars-long
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docs-check:
    name: Docs structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core docs
        run: |
          test -f docs/audit/README.md
          test -f docs/BUSINESS-RULES.md
          test -f AGENTS.md
          test -f docs/decisions/ARCHITECTURE-DECISION.md
          echo "Core documentation present"

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
