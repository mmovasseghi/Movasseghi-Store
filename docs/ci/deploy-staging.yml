name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://movasseghi:movasseghi@localhost:5432/movasseghi
          PAYLOAD_SECRET: ci-build-secret-min-32-chars-long
          NEXT_PUBLIC_SITE_URL: http://91.107.181.79

  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            export APP_DIR=/var/www/movasseghi-staging/app
            bash -s << 'EOF'
            set -euo pipefail
            cd "$APP_DIR" || exit 1
            git pull origin main
            npm ci
            npm run build
            pm2 restart movasseghi-staging || pm2 start npm --name movasseghi-staging -- start
            EOF
