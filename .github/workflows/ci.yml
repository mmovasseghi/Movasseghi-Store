name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:rte
      - run: dotnet restore MovasseghiShop.sln
      - run: dotnet build MovasseghiShop.sln -c Release --no-restore
      - run: dotnet test MovasseghiShop.sln -c Release --no-build --verbosity normal
