# Place in /etc/nginx/sites-available/movasseghi-shop
# then: sudo ln -s ... sites-enabled/ && sudo rm -f sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#  - Let's Encrypt short-lived IP certificate (SAN = 185.93.88.81) for direct IP origin.
#  - Domain certificate for movasseghistore.com at /etc/ssl/movasseghistore.com/ (separate vhost/SNI).
# Cert path produced by: certbot certonly --preferred-profile shortlived --webroot ... --ip-address 185.93.88.81 --cert-name ip-185-93-88-81
# Renewals must reload nginx (deploy-hook). Domain DNS may sit behind CDN; this file serves the public IP origin.
#
# Shared proxy locations live in nginx-movasseghi-proxy.inc (copied next to this file on the VPS).

map $arg_v $ms_asset_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

map $remote_addr $ms_local_probe {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

# Shared proxy/cache rules for HTTP→HTTPS redirect host and TLS vhost.
# ACME HTTP-01 must remain on :80 without redirect.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name movasseghistore.com www.movasseghistore.com movasseghi.ir www.movasseghi.ir _;

    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    # Prefer a single canonical HTTPS origin for browsers / lab HTTPS-First.
    # Deploy smoke hits https://$MS_SMOKE_HOST directly (trusted IP cert).
    location / {
        return 301 https://$host$request_uri;
    }
}

# Direct IP / default HTTPS — must stay on the IP certificate only.
# Do not list both ssl_certificate lines in one server: clients negotiate one chain and
# the domain ECDSA leaf can win over the IP SAN cert (hostname/IP mismatch).
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 185.93.88.81 movasseghi.ir www.movasseghi.ir _;

    ssl_certificate     /etc/letsencrypt/live/ip-185-93-88-81/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-185-93-88-81/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MS_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/movasseghi-shop-proxy.inc;
}

# Domain HTTPS — SNI movasseghistore.com (origin behind CDN or direct).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name movasseghistore.com www.movasseghistore.com;

    ssl_certificate     /etc/ssl/movasseghistore.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/movasseghistore.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MS_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/movasseghi-shop-proxy.inc;
}
