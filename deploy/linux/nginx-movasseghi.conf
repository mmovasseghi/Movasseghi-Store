# Place in /etc/nginx/sites-available/movasseghi
# then: sudo ln -s ... sites-enabled/ && sudo rm -f sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name movasseghi.ir www.movasseghi.ir _;

    client_max_body_size 32M;

    # Legacy subpath (301 to site root)
    location = /MOVASSEGHISTORE {
        return 301 /;
    }
    location ^~ /MOVASSEGHISTORE/ {
        rewrite ^/MOVASSEGHISTORE(/.*)$ $1 permanent;
    }

    # Static assets — مستقیم از publish/wwwroot (بدون Kestrel) برای LCP و کش
    location ~* ^/(css|js|fonts|images|lib)/ {
        root /MOVASSEGHISTORE/publish/wwwroot;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
