# Place in /etc/nginx/sites-available/movasseghi
# then: sudo ln -s ... sites-enabled/ && sudo rm -f sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name movasseghi.ir www.movasseghi.ir _;

    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/html text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 1;

    # صفحهٔ عمومی مهمان — GTmetrix بدون کوکی؛ کاربر لاگین‌شده از کش رد می‌شود
    set $ms_skip_cache 0;
    if ($http_cookie ~* "(Identity|AspNetCore)") {
        set $ms_skip_cache 1;
    }

    # Legacy subpath (301 to site root)
    location = /MOVASSEGHISTORE {
        return 301 /;
    }
    location ^~ /MOVASSEGHISTORE/ {
        rewrite ^/MOVASSEGHISTORE(/.*)$ $1 permanent;
    }

    # Static assets — مستقیم از publish/wwwroot (بدون Kestrel) برای LCP و کش
    location ~* ^/(css|js|fonts|images|lib)/ {
        root /MOVASSEGHISTORE/publish/wwwroot;
        try_files $uri =404;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # LCP resize — Kestrel (ImageSharp)
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /Admin/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    location ^~ /Account/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache ms_pages;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_key "$host$request_method$request_uri|$http_accept_encoding";
        proxy_cache_bypass $ms_skip_cache;
        proxy_no_cache $ms_skip_cache;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=900" always;
    }
}
