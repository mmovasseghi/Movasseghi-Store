# Place in /etc/nginx/sites-available/movasseghi
# then: sudo ln -s ... sites-enabled/ && sudo rm -f sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Let's Encrypt short-lived IP certificate (SAN = 185.93.88.81).
# Cert path produced by: certbot certonly --preferred-profile shortlived --webroot ... --ip-address 185.93.88.81 --cert-name ip-185-93-88-81
# Renewals must reload nginx (deploy-hook). Domain DNS is separate; this file serves the public IP origin.

map $arg_v $ms_asset_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

map $remote_addr $ms_local_probe {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

# Shared proxy/cache rules for HTTP→HTTPS redirect host and TLS vhost.
# ACME HTTP-01 must remain on :80 without redirect.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name movasseghi.ir www.movasseghi.ir _;

    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    # Prefer a single canonical HTTPS origin for browsers / lab HTTPS-First.
    # Deploy smoke hits https://$MS_SMOKE_HOST directly (trusted IP cert).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name movasseghi.ir www.movasseghi.ir _;

    ssl_certificate     /etc/letsencrypt/live/ip-185-93-88-81/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-185-93-88-81/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MS_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32M;

    # Only direct local probes can bypass deployment maintenance.
    set $ms_deploying 0;
    if (-f /MOVASSEGHISTORE/.deploying) { set $ms_deploying 1; }
    if ($ms_local_probe = 1) { set $ms_deploying 0; }
    if ($ms_deploying = 1) { return 503; }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 4;

    # صفحهٔ عمومی مهمان — GTmetrix بدون کوکی؛ کاربر لاگین‌شده از کش رد می‌شود
    set $ms_skip_cache 0;
    if ($http_authorization != "") {
        set $ms_skip_cache 1;
    }
    if ($http_cookie ~* "(Identity|AspNetCore|ms_cart_n=)") {
        set $ms_skip_cache 1;
    }
    # Only explicitly public pages may enter the shared cache. In particular,
    # guest orders, invoices, payment callbacks and cart fragments are private.
    if ($uri !~* "^(/$|/Home/?$|/Home/Stories\.json$|/(Catalog|Shop|Blog|News|Page)(/|$)|/sitemap[^/]*\.xml$|/(robots|llms|ai)\.txt$)") {
        set $ms_skip_cache 1;
    }

    # Legacy subpath (301 to site root)
    location = /MOVASSEGHISTORE {
        return 301 /;
    }
    location ^~ /MOVASSEGHISTORE/ {
        rewrite ^/MOVASSEGHISTORE(/.*)$ $1 permanent;
    }

    # Static assets — مستقیم از publish/wwwroot (بدون Kestrel) برای LCP و کش
    location ~* ^/(css|js|fonts|images|lib)/ {
        root /MOVASSEGHISTORE/publish/wwwroot;
        try_files $uri =404;
        access_log off;
        # asp-append-version fingerprints CSS/JS. Image URLs can be overwritten
        # by uploads or optimization, so unversioned assets must revalidate.
        add_header Cache-Control $ms_asset_cache_control;
    }

    # LCP resize — Kestrel (ImageSharp)
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=0" always;
    }

    location ^~ /Admin/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=0" always;
    }

    location ^~ /Account/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=0" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        # Compress once at nginx; avoid caching Kestrel's larger streamed gzip.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache ms_pages;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30m;
        proxy_cache_key "$host$request_method$request_uri|$http_accept_encoding";
        proxy_cache_bypass $ms_skip_cache;
        proxy_no_cache $ms_skip_cache;
        proxy_cache_lock on;
        # Hide Kestrel HSTS (unsafe on short-lived IP certs) and clear any prior pin.
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=0" always;
        add_header X-Cache $upstream_cache_status always;
    }
}
